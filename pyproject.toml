[project]
name = "steane-qec-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pylatexenc>=2.11",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
